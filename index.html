<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta Cat Lover</title>
<style>
  :root {
    --fondo: #17122b;
    --tarjeta: #6b4eff;
    --texto: #f6f2ff;
    --suave: #cfc6f5;
    --boton: #ffffff;
    --boton-texto: #1d1640;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  .pase {
    width: min(100%, 340px);
    aspect-ratio: 1.586;
    background: var(--tarjeta);
    border-radius: 18px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  }
  .pase small { color: var(--suave); font-size: .85rem; }
  .pase h1 { margin: 4px 0 0; font-size: 1.6rem; line-height: 1.15; }
  .pase p { margin: 0; font-size: 1.05rem; }
  .pase .gato { font-size: 2rem; align-self: flex-end; }
  button {
    background: var(--boton);
    color: var(--boton-texto);
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  [hidden] { display: none !important; }
  .zona-wallet { background: #fff; border-radius: 14px; padding: 12px; }
  button.wallet { background: none; border: 0; padding: 0; border-radius: 0; line-height: 0; }
  button.wallet img { display: block; height: 56px; width: auto; }
  button.wallet.texto { background: #000; color: #fff; border-radius: 8px; padding: 16px 24px; line-height: 1.2; }
  button:focus-visible { outline: 3px solid #ffd45e; outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: wait; }
  #estado { min-height: 1.4em; margin: 0; color: var(--suave); text-align: center; max-width: 340px; }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: transform .15s; }
    button:active { transform: scale(.97); }
  }
</style>
</head>
<body>
  <div class="pase" aria-hidden="true">
    <div>
      <small>Cat Lover</small>
      <h1>Tarjeta de miembro</h1>
    </div>
    <p>Amante de los gatitos</p>
    <span class="gato">🐱</span>
  </div>

  <div class="zona-wallet">
    <button id="agregar" class="wallet" type="button" aria-label="Agregar a Google Wallet">
      <img id="wallet-img" src="boton-wallet.svg" alt="Agregar a Google Wallet">
      <span id="wallet-texto" hidden>Agregar a Google Wallet</span>
    </button>
  </div>
  <p id="estado" role="status"></p>

<script>
  // 1) Cambia estas dos líneas por los datos de tu proyecto de Supabase
  //    (Settings → API: "Project URL" y la clave "anon public").
  const SUPABASE_URL = "https://xeongtzcemodcpfdzqws.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_IxRc3zvk4U-CffDnqNzAcQ_4UaoPCp3";
  // 2) Nombre que le pusiste a la función en Supabase.
  const NOMBRE_FUNCION = "wallet-pass";

  const boton = document.getElementById("agregar");
  const estado = document.getElementById("estado");

  boton.addEventListener("click", async () => {
    boton.disabled = true;
    estado.textContent = "Preparando tu tarjeta…";
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/${NOMBRE_FUNCION}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY
        },
        body: "{}"
      });
      const datos = await r.json();
      if (!r.ok || !datos.url) throw new Error(datos.error || "Respuesta inválida");
      window.location.href = datos.url;
    } catch (e) {
      estado.textContent = "No se pudo crear la tarjeta: " + e.message;
      boton.disabled = false;
    }
  });

  // Si todavía no subes el botón oficial (boton-wallet.svg), se muestra uno de texto negro.
  const imgWallet = document.getElementById("wallet-img");
  const textoWallet = document.getElementById("wallet-texto");
  function usarRespaldo() {
    imgWallet.hidden = true;
    textoWallet.hidden = false;
    boton.classList.add("texto");
  }
  imgWallet.addEventListener("error", usarRespaldo);
  // por si la imagen ya falló antes de que corriera este código
  if (imgWallet.complete && imgWallet.naturalWidth === 0) usarRespaldo();
</script>
</body>
</html>
